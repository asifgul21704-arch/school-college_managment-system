name: Verify application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: integration-test-only-secret-with-at-least-32-characters
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/school_management_integration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and static regression tests
        run: npm test
      - name: Run real MongoDB integration tests
        run: npm run test:integration
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
