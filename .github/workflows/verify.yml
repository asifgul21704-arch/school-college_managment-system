name: Verify application

on:
  push:
    branches:
      - feature/premium-finance-reports
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and notification idempotency tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: TypeScript check
        run: npm run lint

  parent-payment-e2e:
    needs: build-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://127.0.0.1:27017/e2e_parent_payment?replicaSet=rs0
      JWT_SECRET: ci-only-e2e-jwt-secret-never-use-in-production-2026
      DISABLE_AUTO_SEED: "true"
      E2E_ALLOW_MUTATIONS: "true"
      E2E_EXPECTED_DATABASE_NAME: e2e_parent_payment
      E2E_API_BASE_URL: http://127.0.0.1:3000/api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start isolated replica-set MongoDB
        run: |
          docker run -d --name e2e-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec e2e-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q '^1$\|^1\.0$\|^true$'; then
              break
            fi
            sleep 2
          done
          docker exec e2e-mongo mongosh --quiet --eval 'rs.initiate()'
          for attempt in {1..30}; do
            if docker exec e2e-mongo mongosh --quiet --eval 'try { rs.status().members.some(member => member.stateStr === "PRIMARY") ? 1 : 0 } catch (error) { 0 }' 2>/dev/null | grep -q '^1$\|^true$'; then
              echo "Disposable MongoDB replica set is PRIMARY."
              exit 0
            fi
            sleep 2
          done
          docker logs e2e-mongo
          exit 1
      - name: Start API against disposable MongoDB
        run: |
          npm run dev > /tmp/shawan-parent-e2e-server.log 2>&1 &
          echo $! > /tmp/shawan-parent-e2e-server.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"connected":true'; then
              echo "API connected to the disposable E2E database."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/shawan-parent-e2e-server.log
          exit 1
      - name: Run parent/student permissions and payment-history E2E
        run: node --import tsx --test server/parentPaymentE2E.test.ts
      - name: Show API logs on failure
        if: failure()
        run: |
          test ! -f /tmp/shawan-parent-e2e-server.log || cat /tmp/shawan-parent-e2e-server.log
          docker logs e2e-mongo || true
      - name: Remove isolated MongoDB
        if: always()
        run: docker rm -f e2e-mongo || true
