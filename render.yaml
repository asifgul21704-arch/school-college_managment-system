services:
  - type: web
    name: shawan-school-backend
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: shawan-Persistent-Uploads
      mountPath: /var/data/shawan_uploads
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: UPLOAD_STORAGE_DIR
        value: /var/data/shawan_uploads
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
      - key: DISABLE_AUTO_SEED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
